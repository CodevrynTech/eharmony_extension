# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard -> New -> Blueprint -> pick this repo. Then fill in the two secrets marked "sync: false".
services:
  - type: web
    name: profile-message-writer
    runtime: node
    plan: starter            # the free plan sleeps after 15 min idle -> 30-60 s cold starts; use starter for real use
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod
    startCommand: node server/src/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false          # secret: paste in the dashboard
      - key: LICENSES
        sync: false          # secret: label:token[:dailyLimit],label:token ...  (see README; `pnpm license <label>`)
      - key: DEFAULT_DAILY_QUOTA
        value: 50
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_EXTENSION_IDS
        sync: false          # optional: comma-separated extension id(s) allowed to call the API
